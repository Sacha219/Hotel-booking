name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "22"

jobs:
  backend-tests:
    name: Backend build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ secrets.POSTGRES_DB }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.POSTGRES_USER }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_SHOW_SQL: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Maven tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: royalstay-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: royalstay-frontend:ci

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      RENDER_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
      RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
    steps:
      - name: Check deploy hook secrets
        run: |
          test -n "$RENDER_BACKEND_DEPLOY_HOOK_URL" || (echo "Missing RENDER_BACKEND_DEPLOY_HOOK_URL" && exit 1)
          test -n "$RENDER_FRONTEND_DEPLOY_HOOK_URL" || (echo "Missing RENDER_FRONTEND_DEPLOY_HOOK_URL" && exit 1)

      - name: Trigger backend deploy
        run: curl -fsS -X POST "$RENDER_BACKEND_DEPLOY_HOOK_URL"

      - name: Trigger frontend deploy
        run: curl -fsS -X POST "$RENDER_FRONTEND_DEPLOY_HOOK_URL"

  healthcheck:
    name: Production healthcheck
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    env:
      APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
    steps:
      - name: Wait for healthy backend
        run: |
          test -n "$APP_HEALTH_URL" || (echo "Missing APP_HEALTH_URL repository variable" && exit 1)

          for attempt in $(seq 1 30); do
            echo "Healthcheck attempt $attempt"
            response="$(curl -fsS "$APP_HEALTH_URL" || true)"

            if echo "$response" | grep -q '"status":"UP"'; then
              echo "$response"
              exit 0
            fi

            sleep 10
          done

          echo "Healthcheck failed for $APP_HEALTH_URL"
          exit 1