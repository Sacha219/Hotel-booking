databases:
  - name: royalstay-db
    plan: free
    databaseName: royalstay
    postgresMajorVersion: "17"

services:
  - type: web
    name: royalstay-backend
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /actuator/health
    envVars:
      # Порт, который Render назначает автоматически (обычно 10000)
      - key: PORT
        value: "10000"
      # Компоненты подключения к БД – Render подставит их из базы
      - key: DB_HOST
        fromDatabase:
          name: royalstay-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: royalstay-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: royalstay-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: royalstay-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: royalstay-db
          property: password
      # Дополнительные настройки Spring
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://royalstay-frontend.onrender.com
      - key: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
        value: never

  - type: web
    name: royalstay-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_URL
        value: https://royalstay-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html