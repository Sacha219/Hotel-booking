databases:
  - name: royalstay-db
    plan: free
    databaseName: royalstay
    postgresMajorVersion: "17"

services:
  - type: web
    name: royalstay-backend
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: royalstay-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: royalstay-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: royalstay-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://royalstay-frontend.onrender.com
      - key: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
        value: never

  - type: web
    name: royalstay-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_URL
        value: https://royalstay-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
